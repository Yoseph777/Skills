<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/login.css">
    <title>Login - PennyWise</title>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
    <header class="nav">
        <a href="index.html" class="logo">PennyWise</a>
    </header>

    <div class="center-wrapper">
        <fieldset class="login-form-wrapper">
            <legend>Welcome Back</legend>

            <form id="loginForm" class="login-form">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>

                <div id="errorMessage" class="error-message hidden"></div>

                <button class="submit-btn" type="submit">Login</button>
                
                <p class="redirect-text">
                    Don't have an account? <a href="register.html">Register here</a>
                </p>
            </form>
        </fieldset>
    </div>

    <script>
        // API Configuration - Single unified API file
        const API_FILE = 'api.php';
        
        // Check if already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(`${API_FILE}?action=check`);
                const data = await response.json();
                
                if (data.success && data.data.authenticated) {
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.log('Session check failed:', error);
            }
        });
        
        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = document.querySelector('.submit-btn');
            
            errorMessage.classList.add('hidden');
            errorMessage.textContent = '';
            
            if (!email || !password) {
                errorMessage.textContent = 'Please fill in all fields.';
                errorMessage.classList.remove('hidden');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';
            
            try {
                const response = await fetch(`${API_FILE}?action=login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    submitBtn.textContent = 'Success!';
                    submitBtn.style.backgroundColor = '#10b981';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                } else {
                    errorMessage.textContent = data.message || 'Login failed. Please try again.';
                    errorMessage.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Login';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = 'Connection error. Please check if the server is running.';
                errorMessage.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
